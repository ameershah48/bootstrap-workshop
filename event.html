<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.css">


    <style>
        .carousel-item {
            height: 300px;
        }
    </style>
</head>

<body>

    <div class="container-fluid">
      <button class="btn btn-primary" id="btnClick">click</button>
      <button class="btn btn-success" id="btnHover">hover</button>
      <input type="text" class="form-control" id="inputText">


      <div class="card mt-3">
        <div class="card-header">
            <p id="userName">
                name
            </p>
        </div>
        <div class="card-body">
            <p id="userEmail">emel</p>
            <p id="userPhone">phone</p>
            <p id="userWebsite">website</p>
        </div>
      </div>


    </div>

    <script>
        const btnClick = document.getElementById('btnClick');
        const btnHover = document.getElementById('btnHover');
        const inputText = document.getElementById('inputText');

        btnClick.addEventListener("click", async function(){
            const userId = inputText.value;
            const response = await fetch("https://jsonplaceholder.typicode.com/users/" + userId);
            const data = await response.json();

            console.log(data)

            const userName = document.getElementById('userName');
            const userEmail = document.getElementById('userEmail');
            const userPhone = document.getElementById('userPhone');
            const userWebsite = document.getElementById('userWebsite');

            userName.textContent = data.name;
            userEmail.textContent = data.email;
            userPhone.textContent = data.phone;
            userWebsite.textContent = data.website;
        });

        // btnHover.addEventListener("mouseenter", function(){
        //     alert(inputText.value)
        // });

        // inputText.addEventListener("input", (event) => console.log(event.target.value))

        // Update UI with Data
        // document.getElementById('userName').textContent = data.name;
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
